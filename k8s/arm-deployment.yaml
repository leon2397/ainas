# ==============================================================================
#  AI-NAS ARM Device Deployment (Edge Node)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-nas-arm
  namespace: ai-nas
  labels:
    app.kubernetes.io/name: ai-nas-arm
    app.kubernetes.io/component: arm-device
    app.kubernetes.io/version: "2.0"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-nas-arm
  template:
    metadata:
      labels:
        app: ai-nas-arm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: arm-server
          image: ai-nas-arm:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-nas-config
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: AI_NAS_DEVICE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AI_NAS_HOST
              value: "0.0.0.0"
            - name: AI_NAS_PORT
              value: "8000"
            - name: AI_NAS_STORAGE_PATH
              value: "/nas"
            - name: AI_NAS_WIN_SERVER_HOST
              valueFrom:
                configMapKeyRef:
                  name: ai-nas-config
                  key: ARM_WIN_SERVER_HOST
            - name: AI_NAS_LOG_DIR
              value: "/app/logs"
          volumeMounts:
            - name: config
              mountPath: /app/config/config.yaml
              subPath: arm-config.yaml
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: nas-storage
              mountPath: /nas
            # NPU device mount (only on nodes with BM1688)
            # - name: npu-device
            #   mountPath: /dev/sophon
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: ai-nas-config
        - name: data
          persistentVolumeClaim:
            claimName: ai-nas-arm-data
        - name: logs
          emptyDir:
            sizeLimit: 100Mi
        - name: nas-storage
          persistentVolumeClaim:
            claimName: ai-nas-nas-storage
        # NPU device plugin (Sophon BM1688)
        # - name: npu-device
        #   hostPath:
        #     path: /dev/sophon
        #     type: Directory
      # ─── ARM Node Affinity ─────────────────────────────────
      # Schedule ARM pods to arm64 nodes only
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - arm64
                      - arm
          # Optional: prefer nodes with NPU label
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: npu.type
                    operator: In
                    values:
                      - bm1688
---
apiVersion: v1
kind: Service
metadata:
  name: ai-nas-arm
  namespace: ai-nas
  labels:
    app.kubernetes.io/name: ai-nas-arm
    app.kubernetes.io/component: arm-device
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app: ai-nas-arm
---
# PVC for ARM node local data (models cache, etc.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-nas-arm-data
  namespace: ai-nas
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: standard