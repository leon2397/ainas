apiVersion: v1
kind: Secret
metadata:
  name: ai-nas-secrets
  namespace: ai-nas
  labels:
    app.kubernetes.io/name: ai-nas
    app.kubernetes.io/component: secrets
type: Opaque
# ─── 这是一份示例文件，请勿直接用于生产 ────────────────────────────
#
# 使用方法：
#   1. 复制成真实文件（真实文件已在 .gitignore 中，不会被提交）：
#        cp k8s/secret.example.yaml k8s/secret.yaml
#   2. 填入真实值：
#        echo -n 'your-secret-value' | base64
#   3. kubectl apply -f k8s/secret.yaml
#
# ⚠️ 真实密钥绝不要提交到版本库——公网可见的仓库等同于密钥公开。
#    生产环境更推荐用 Sealed Secrets / External Secrets，
#    或直接在集群里用 kubectl create secret generic 手工创建。
data:
  # JWT signing secret（必填，生产必须替换）
  jwt-secret: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tcGxlYXNl
  # 数据库加密密钥（可选）
  db-encrypt-key: ""
  # 云存储凭据（可选，留空则不启用云存储插件）
  # cloud-access-key: ""
  # cloud-secret-key: ""
  # cloud-bucket: ""
  # BM1688 NPU 许可证（可选）
  # npu-license-key: ""
