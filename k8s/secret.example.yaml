apiVersion: v1
kind: Secret
metadata:
  name: ai-nas-secrets
  namespace: ai-nas
  labels:
    app.kubernetes.io/name: ai-nas
    app.kubernetes.io/component: secrets
type: Opaque
# ─── IMPORTANT ──────────────────────────────────────────────
# These are base64-encoded placeholder values.
# Replace with your own values:
#   echo -n 'your-secret-value' | base64
# ────────────────────────────────────────────────────────────
data:
  # JWT signing secret (REQUIRED - change in production!)
  jwt-secret: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tcGxlYXNl
  # Database encryption key (optional)
  db-encrypt-key: ""
  # Cloud storage credentials (optional, for future use)
  # cloud-access-key: ""
  # cloud-secret-key: ""
  # cloud-bucket: ""
  # BM1688 NPU license (optional)
  # npu-license-key: ""