# ==============================================================================
#  AI-NAS Horizontal Pod Autoscaler (HPA)
#  Auto-scales ARM device pods based on CPU/memory usage
#  Requires metrics-server installed in cluster
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-nas-arm-hpa
  namespace: ai-nas
  labels:
    app.kubernetes.io/name: ai-nas-arm
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-nas-arm
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
---
# ==============================================================================
#  AI-NAS Pod Disruption Budget
#  Ensures at least 1 ARM pod is available during node maintenance
# ==============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-nas-arm-pdb
  namespace: ai-nas
  labels:
    app.kubernetes.io/name: ai-nas-arm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-nas-arm