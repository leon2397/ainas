# ==============================================================================
#  AI-NAS Backend Deployment (Windows/Main Server)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-nas-backend
  namespace: ai-nas
  labels:
    app.kubernetes.io/name: ai-nas-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "2.0"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-nas-backend
  template:
    metadata:
      labels:
        app: ai-nas-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: ai-nas-backend:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-nas-config
            - secretRef:
                name: ai-nas-secrets
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-nas-secrets
                  key: jwt-secret
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: nas-storage
              mountPath: /nas
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ai-nas-backend-data
        - name: logs
          emptyDir:
            sizeLimit: 100Mi
        - name: nas-storage
          persistentVolumeClaim:
            claimName: ai-nas-nas-storage
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
---
apiVersion: v1
kind: Service
metadata:
  name: ai-nas-backend
  namespace: ai-nas
  labels:
    app.kubernetes.io/name: ai-nas-backend
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app: ai-nas-backend
---
# PVC for backend data (SQLite DB, ChromaDB, etc.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-nas-backend-data
  namespace: ai-nas
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
# PVC for NAS shared storage (photos, albums, etc.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-nas-nas-storage
  namespace: ai-nas
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: nfs  # Use NFS or CephFS for multi-pod RWM