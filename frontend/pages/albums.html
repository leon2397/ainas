<!-- 相册页面模板 -->
<div class="content-header d-flex justify-content-between align-items-center">
    <h4><i class="fas fa-folder-open me-2"></i>相册</h4>
    <div>
        <select class="form-select form-select-sm d-inline-block" id="album-sort" onchange="loadAlbums()" style="width:120px;">
            <option value="name_asc">名称 A-Z</option>
            <option value="name_desc">名称 Z-A</option>
            <option value="date_desc">最新创建</option>
            <option value="count_desc">文件最多</option>
        </select>
        <button class="btn btn-primary btn-sm ms-2" onclick="showCreateAlbumModal()">
            <i class="fas fa-plus me-1"></i>新建相册
        </button>
    </div>
</div>

<div class="row albums-grid" id="albums-grid">
    <div class="text-center text-muted py-5 w-100">
        <i class="fas fa-folder-open fa-3x mb-3"></i>
        <p>暂无相册</p>
    </div>
</div>

<!-- 创建相册弹窗 -->
<div class="modal fade" id="createAlbumModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">创建相册</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">相册名称</label>
                    <input type="text" class="form-control" id="album-name" placeholder="我的相册">
                </div>
                <div class="mb-3">
                    <label class="form-label">相册类型</label>
                    <select class="form-select" id="album-type">
                        <option value="custom">自定义</option>
                        <option value="person">人物</option>
                        <option value="scene">场景</option>
                        <option value="date">日期</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="createAlbum()">创建</button>
            </div>
        </div>
    </div>
</div>

<!-- 添加到相册弹窗 -->
<div class="modal fade" id="addToAlbumModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加到相册</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">选择相册</label>
                    <select class="form-select" id="target-album-id">
                        <option value="">加载中...</option>
                    </select>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="create-new-album-check">
                    <label class="form-check-label" for="create-new-album-check">创建新相册</label>
                </div>
                <div class="mt-2" id="new-album-input" style="display:none;">
                    <input type="text" class="form-control" id="new-album-name" placeholder="新相册名称">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="addToAlbum()">确定</button>
            </div>
        </div>
    </div>
</div>
