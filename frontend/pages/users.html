<!-- 用户管理页面模板 -->
<div class="content-header d-flex justify-content-between align-items-center">
    <h4><i class="fas fa-users-cog me-2"></i>用户管理</h4>
    <button class="btn btn-primary btn-sm" onclick="showCreateUserModal()">
        <i class="fas fa-user-plus me-1"></i>创建用户
    </button>
</div>

<div class="card p-3">
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>用户名</th>
                    <th>角色</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="users-table-body">
                <tr><td colspan="4" class="text-center text-muted">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 创建用户弹窗 -->
<div class="modal fade" id="createUserModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">创建用户</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-control" id="new-username" placeholder="用户名">
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" id="new-password" placeholder="密码（至少6位）">
                </div>
                <div class="mb-3">
                    <label class="form-label">角色</label>
                    <select class="form-select" id="new-user-role">
                        <option value="viewer">访客（只读）</option>
                        <option value="editor">编辑者（媒体管理）</option>
                        <option value="admin">管理员（全部权限）</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="createUser()">创建</button>
            </div>
        </div>
    </div>
</div>
