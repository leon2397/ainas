<!-- 任务页面模板 -->
<div class="content-header">
    <h4><i class="fas fa-tasks me-2"></i>任务列表</h4>
</div>

<div class="card p-3">
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>任务ID</th>
                    <th>类型</th>
                    <th>设备</th>
                    <th>状态</th>
                    <th>进度</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tasks-table-body">
                <tr><td colspan="7" class="text-center text-muted">暂无任务</td></tr>
            </tbody>
        </table>
    </div>
</div>
