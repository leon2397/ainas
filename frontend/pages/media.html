<!-- 媒体库页面模板 -->
<div class="content-header d-flex justify-content-between align-items-center flex-wrap">
    <h4><i class="fas fa-images me-2"></i>媒体库</h4>
    <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-outline-primary btn-sm" onclick="toggleBatchMode()">
            <i class="fas fa-check-square me-1"></i>批量操作
        </button>
        <button class="btn btn-outline-secondary btn-sm" onclick="toggleAdvancedSearch()">
            <i class="fas fa-search me-1"></i>高级搜索
        </button>
        <select class="form-select form-select-sm" id="media-type-filter" onchange="filterMediaType(this.value)" style="width:100px;">
            <option value="">全部</option>
            <option value="image">图片</option>
            <option value="video">视频</option>
        </select>
    </div>
</div>

<!-- 高级搜索面板 -->
<div id="advanced-search-panel" class="advanced-search-panel" style="display:none;">
    <div class="row g-2">
        <div class="col-md-3">
            <input type="text" class="form-control form-control-sm" id="adv-keyword" placeholder="关键词">
        </div>
        <div class="col-md-2">
            <select class="form-select form-select-sm" id="adv-file-type">
                <option value="">文件类型</option>
                <option value="image">图片</option>
                <option value="video">视频</option>
            </select>
        </div>
        <div class="col-md-2">
            <input type="text" class="form-control form-control-sm" id="adv-tags" placeholder="标签(逗号分隔)">
        </div>
        <div class="col-md-2">
            <input type="date" class="form-control form-control-sm" id="adv-date-from">
        </div>
        <div class="col-md-2">
            <input type="date" class="form-control form-control-sm" id="adv-date-to">
        </div>
        <div class="col-md-1">
            <button class="btn btn-primary btn-sm w-100" onclick="performAdvancedSearch()">搜索</button>
        </div>
    </div>
</div>

<!-- 批量操作工具栏 -->
<div id="batch-toolbar" class="d-flex gap-2 mb-3" style="display:none !important;">
    <span class="text-muted small">已选: <span id="selected-count">0</span> 项</span>
    <button class="btn btn-sm btn-outline-primary" onclick="selectAllVisible()">
        <i class="fas fa-check-double"></i> 全选
    </button>
    <button class="btn btn-sm btn-outline-info" onclick="showBatchTagModal()">
        <i class="fas fa-tags"></i> 添加标签
    </button>
    <button class="btn btn-sm btn-outline-success" onclick="Media.showAddToAlbumModal()">
        <i class="fas fa-folder-plus"></i> 加入相册
    </button>
    <button class="btn btn-sm btn-outline-danger" onclick="batchDelete()">
        <i class="fas fa-trash"></i> 删除
    </button>
    <button class="btn btn-sm btn-outline-secondary" onclick="exitBatchMode()">取消</button>
</div>

<!-- 媒体网格 -->
<div class="card p-3">
    <div id="media-grid" class="media-grid"></div>
    
    <div id="media-loading" class="loading" style="display:none;">
        <div class="spinner"></div>
    </div>
    
    <div id="media-empty" class="text-center text-muted py-5" style="display:none;">
        <i class="fas fa-images fa-3x mb-3"></i>
        <p>暂无媒体文件</p>
    </div>
    
    <div class="mt-3 text-center">
        <button class="btn btn-outline-primary btn-sm" id="load-more-btn" onclick="loadMoreMedia()" style="display:none;">
            加载更多
        </button>
    </div>
</div>

<!-- 媒体详情弹窗 -->
<div class="modal fade" id="mediaDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="media-detail-title">媒体详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-8 text-center">
                        <img id="media-detail-img" src="" class="modal-detail-img img-fluid rounded">
                    </div>
                    <div class="col-md-4 detail-sidebar">
                        <div class="mb-3">
                            <label class="form-label small text-muted">文件名</label>
                            <div id="media-detail-name">-</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">文件大小</label>
                            <div id="media-detail-size">-</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">拍摄时间</label>
                            <div id="media-detail-date">-</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">AI 分析</label>
                            <div id="media-detail-ai"><span class="badge bg-secondary">未分析</span></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">标签</label>
                            <div id="media-detail-tags" class="d-flex flex-wrap gap-1"></div>
                            <div class="mt-2">
                                <input type="text" class="form-control form-control-sm" id="new-tag-input" 
                                       placeholder="输入标签后回车添加" style="width: 100%;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-primary btn-sm" onclick="downloadMedia()">
                    <i class="fas fa-download me-1"></i>下载
                </button>
                <button type="button" class="btn btn-outline-info btn-sm" onclick="runAIClassify()">
                    <i class="fas fa-robot me-1"></i>AI分析
                </button>
                <button type="button" class="btn btn-outline-danger btn-sm" onclick="deleteCurrentMedia()">
                    <i class="fas fa-trash me-1"></i>删除
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 批量添加标签弹窗 -->
<div class="modal fade" id="batchTagModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">批量添加标签</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">输入标签（逗号分隔）</label>
                    <input type="text" class="form-control" id="batch-tags-input" placeholder="风景,旅游,2024">
                </div>
                <p class="text-muted small">将为选中的 <span id="batch-tag-count">0</span> 个文件添加这些标签</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="batchAddTags()">确定</button>
            </div>
        </div>
    </div>
</div>

<!-- 添加到相册弹窗 -->
<div class="modal fade" id="addToAlbumModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加到相册</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">选择相册</label>
                    <select class="form-select" id="target-album-id">
                        <option value="">加载中...</option>
                    </select>
                </div>
                <p class="text-muted small">将把选中的 <span id="batch-album-count">0</span> 个文件添加到相册</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="Media.batchAddToAlbum()">确定</button>
            </div>
        </div>
    </div>
</div>
