# AINAS 发布
#
# 由 tag 触发（v*）。做三件事：
#   1. 跑一遍 CI 全套（发布前必须绿）
#   2. 构建 Docker 镜像并推到 GitHub Container Registry
#   3. 创建 GitHub Release，附上变更日志
#
# ⚠️ 镜像推送需要仓库设置里启用 Packages 写入权限，
#    且首次推送时 registry 里的包默认是私有的，需要手动改公开。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v1.0.0）'
        required: true

permissions:
  contents: write   # 创建 Release
  packages: write    # 推送镜像

jobs:
  verify:
    name: 发布前验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-min.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-min.txt
          pip install pytest==8.3.3 pytest-asyncio==0.24.0 httpx==0.27.2

      - name: 单元测试
        run: |
          python -m pytest backend/tests/unit/ --junit-xml=pytest-report.xml --tb=short
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import sys
          root = ET.parse("pytest-report.xml").getroot()
          suites = root.findall(".//testsuite")
          total = sum(int(s.get("tests", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) for s in suites)
          errored = sum(int(s.get("errors", 0)) for s in suites)
          print(f"用例 {total} 项，失败 {failed}，错误 {errored}")
          if total == 0 or failed or errored:
              sys.exit(1)
          PY

  image:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, image]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史来生成变更日志

      - name: 生成变更日志
        id: changelog
        # 多行内容写入 $GITHUB_OUTPUT 必须用分隔符语法：
        #   key<<DELIMITER ... DELIMITER
        # 直接写多行会报 "Invalid format"——输出文件是单行 key=value 格式。
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")

          {
            echo "## 变更内容"
            echo ""
            if [ -n "$PREV" ]; then
              git log --pretty="- %s (%h)" "$PREV..$TAG"
              echo ""
              echo "**完整变更**：https://github.com/${{ github.repository }}/compare/$PREV...$TAG"
            else
              git log --pretty="- %s (%h)" -20
            fi

            echo ""
            echo "## Docker 使用"
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:$TAG"
            echo ""
            echo "docker run -d --name ainas -p 8000:8000 \\"
            echo "  -v /你的/媒体目录:/nas \\"
            echo "  -v ainas-data:/app/data \\"
            echo "  ghcr.io/${{ github.repository }}:$TAG"
            echo '```'
            echo ""
            echo "首次启动会随机生成 admin 密码并打印在启动日志中，请从日志获取后立即修改。"
          } > /tmp/changelog.md

          {
            echo "changelog<<CHANGELOG_EOF"
            cat /tmp/changelog.md
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "AINAS $TAG" \
            --notes "${{ steps.changelog.outputs.changelog }}" \
            --verify-tag
